# Posts a message to the Timmerzz Discord (#csup-downloads) for every published release.
# Needs the repository secret DISCORD_WEBHOOK_CSUP (the channel's webhook URL).
#
# The release body can carry the Discord text in a hidden block (GitHub does not show it):
#   <!-- discord
#   ## 🏁 CSUP Mods v0.1.62
#   ...
#   -->
# That text is posted as a normal message, so Discord's own formatting (##, -, **, -#)
# shows exactly as written. Without the block the release is posted as a link card.
name: Discord release message
on:
  release:
    types: [published]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CSUP }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          PRE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_WEBHOOK_CSUP secret set, skipping."; exit 0; fi
          MESSAGE=$(printf '%s\n' "$BODY" | tr -d '\r' | sed -n '/^<!-- discord/,/^-->/p' | sed '1d;$d')
          if [ -n "$MESSAGE" ]; then
            jq -n --arg c "${MESSAGE:0:2000}" \
              '{username:"Timmerzz Releases", content:$c, allowed_mentions:{parse:[]}}' \
            | curl -sS --fail -H "Content-Type: application/json" -d @- "$WEBHOOK"
            exit 0
          fi
          TITLE="${NAME:-$TAG}"
          if [ "$PRE" = "true" ]; then TITLE="🧪 $TITLE (test)"; fi
          jq -n --arg t "$TITLE" --arg u "$URL" --arg b "${BODY:0:1500}" \
            '{username:"Timmerzz Releases", embeds:[{title:$t, url:$u, description:$b, color:15105570, footer:{text:"Download via the link above"}}]}' \
          | curl -sS --fail -H "Content-Type: application/json" -d @- "$WEBHOOK"
