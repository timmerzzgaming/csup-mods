# Posts a message to the Timmerzz Discord (#csup-downloads) for every published release.
# Needs the repository secret DISCORD_WEBHOOK_CSUP (the channel's webhook URL).
name: Discord release message
on:
  release:
    types: [published]
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CSUP }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "No DISCORD_WEBHOOK_CSUP secret set, skipping."; exit 0; fi
          # The release body is written in Discord formatting (see .github/RELEASE_TEMPLATE.md)
          # and posted as a normal message, so headings, bold, lists and -# subtext look the same
          # as a hand-written post. Link previews are suppressed (flags 4), nobody is pinged.
          TEXT="$BODY"
          if [ -z "$TEXT" ]; then TEXT="## 🏁 ${NAME:-$TAG}"; fi
          case "$TEXT" in *"/releases/"*) ;; *) TEXT="$(printf '%s\n\n⬇️ Download: <%s>' "$TEXT" "$URL")";; esac
          jq -n --arg c "${TEXT:0:2000}" \
            '{username:"Timmerzz Releases", content:$c, flags:4, allowed_mentions:{parse:[]}}' \
          | curl -sS --fail -H "Content-Type: application/json" -d @- "$WEBHOOK"
